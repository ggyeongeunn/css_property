<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>font size</title>
    <style>
      /* html {
        font-size: 16px;
      }
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 3rem;
      } */
      /* 
       rem - body
       em - parents
       */
      .box {
        font-size: 20px;
      }
      .box p {
        font-size: 2em;
      }
      .text {
        text-transform: lowercase;
        text-transform: uppercase;
        text-transform: capitalize;
      }
      h1 {
        color: #29cec6;
        text-shadow: 0 0 5px #0963ca;
      }
      .letter {
        /* text-align: justify; */
        /* letter-spacing: -0.05em; */
        word-spacing: -1px;
        text-indent: -1em;
      }
      ul {
        list-style: "🍟";
        /* list-style: none;
        padding: 0; */
        margin-left: 100px;
      }
      li {
        list-style-image: url("example.png");
        background-position: left center;
      }
    </style>
  </head>
  <body>
    <h1>title</h1>
    <p>hello</p>
    <div>nice to meet you</div>
    <div class="box">
      <p>hi</p>
    </div>
    <p class="text">Html, Css, JavaScript</p>
    <div class="letter">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem
      laboriosam quam, voluptatem voluptatum accusantium incidunt vero?
      Provident nobis cum magni.
    </div>
    <ul>
      <li>menu01</li>
      <li>menu02</li>
      <li>menu03</li>
    </ul>
  </body>
</html>
